<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>CampusVend Kiosk</title>
<style>
:root { --bg: #0d1b1e; --panel: #142a2e; --card: #1b383d; --line: #2b5158; --text: #f2f7f7; --text2: #a9c4c7; --accent: #2dd4bf; --accent-ink: #052825; --warn: #fbbf24; --bad: #f87171; --good: #4ade80; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--text); font: 22px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; touch-action: manipulation; }
button { font: inherit; color: inherit; border: 0; cursor: pointer; }
.screen { position: absolute; inset: 0; display: none; flex-direction: column; } .screen.on { display: flex; }
header { display: flex; justify-content: space-between; align-items: center; padding: 22px 28px; background: var(--panel); }
header .logo { font-size: 30px; font-weight: 800; color: var(--accent); } header .where { color: var(--text2); font-size: 20px; text-align: right; }
.tabs { display: flex; gap: 10px; padding: 16px 24px; overflow-x: auto; flex: none; }
.tabs button { background: var(--card); padding: 14px 24px; border-radius: 40px; white-space: nowrap; font-weight: 600; } .tabs button.on { background: var(--accent); color: var(--accent-ink); }
.grid { flex: 1; overflow-y: auto; padding: 8px 24px 24px; display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; align-content: start; }
.item { background: var(--card); border-radius: 20px; padding: 18px 14px; display: grid; gap: 6px; text-align: center; position: relative; min-height: 210px; }
.item:active { transform: scale(.97); } .item .em { font-size: 64px; line-height: 1.1; } .item .nm { font-size: 19px; min-height: 2.6em; }
.item .pr { font-size: 28px; font-weight: 800; color: var(--accent); } .item .code { position: absolute; top: 10px; left: 12px; font-size: 16px; color: var(--text2); font-weight: 700; }
.item.out { opacity: .4; } .item.out .pr { color: var(--text2); font-size: 20px; }
footer { padding: 14px 28px; background: var(--panel); color: var(--text2); font-size: 18px; display: flex; justify-content: space-between; }
.center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 40px; text-align: center; }
.big { font-size: 44px; font-weight: 800; } .huge { font-size: 110px; line-height: 1; } .sub { color: var(--text2); white-space: pre-line; max-width: 22em; }
.btn { background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: 28px; padding: 26px 40px; border-radius: 22px; min-width: 340px; }
.btn.alt { background: var(--card); color: var(--text); } .btn.ghost { background: none; color: var(--text2); font-weight: 600; font-size: 24px; min-width: 0; }
.btn:active { transform: scale(.97); } .btn:disabled { opacity: .5; }
.paybtns { display: grid; gap: 18px; }
.qr { background: #fff; padding: 18px; border-radius: 22px; width: 380px; height: 380px; display: grid; place-items: center; } .qr img { width: 100%; height: 100%; object-fit: contain; }
.qr.demo { color: #111; font-weight: 800; font-size: 26px; border: 10px dashed #999; }
.count { font-variant-numeric: tabular-nums; color: var(--warn); font-weight: 700; }
.spin { width: 110px; height: 110px; border: 12px solid var(--card); border-top-color: var(--accent); border-radius: 50%; animation: sp 1s linear infinite; } @keyframes sp { to { transform: rotate(360deg); } }
#sleep { background: #060d0f; } #sleep .big { color: var(--text2); } .clock { font-size: 90px; font-weight: 200; color: var(--text2); }
.pinpad { display: grid; grid-template-columns: repeat(3, 110px); gap: 14px; } .pinpad button { background: var(--card); height: 100px; border-radius: 20px; font-size: 36px; font-weight: 700; }
.dots { font-size: 44px; letter-spacing: 14px; min-height: 1.3em; }
.svc { flex: 1; overflow-y: auto; padding: 16px 24px; display: grid; gap: 10px; align-content: start; }
.svcrow { background: var(--card); border-radius: 16px; padding: 12px 16px; display: grid; grid-template-columns: 60px 1fr auto; gap: 12px; align-items: center; font-size: 20px; }
.svcrow.fault { outline: 3px solid var(--bad); } .step { display: flex; align-items: center; gap: 12px; } .step button { background: var(--panel); width: 64px; height: 64px; border-radius: 14px; font-size: 30px; font-weight: 800; }
.step b { min-width: 86px; text-align: center; font-size: 24px; } .svcbar { display: flex; gap: 12px; padding: 16px 24px; background: var(--panel); flex-wrap: wrap; } .svcbar .btn { min-width: 0; flex: 1; font-size: 22px; padding: 20px; }
.err { color: var(--bad); min-height: 1.4em; }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }
</style>
</head>
<body>
<section class="screen" id="setup"><div class="center"><div class="big">Kiosk not set up</div><p class="sub">Open this page with the machine key:<br>/kiosk/#key=YOUR-MACHINE-KEY</p><p class="err" id="setupErr"></p></div></section>

<section class="screen" id="sleep"><div class="center"><div class="clock" id="clock"></div><div class="huge" id="sleepIcon">😴</div><div class="big" id="sleepTitle">Sleeping</div><p class="sub" id="sleepMsg"></p></div></section>

<section class="screen" id="browse">
  <header><div class="logo" id="logo">CampusVend</div><div class="where"><div id="mName"></div><div id="mCampus"></div></div></header>
  <div class="tabs" id="tabs"></div><div class="grid" id="grid"></div>
  <footer><span>Tap an item to buy</span><span>UPI<span id="cardNote"> · Debit / credit card (tap)</span></span></footer>
</section>

<section class="screen" id="confirm"><div class="center">
  <div class="huge" id="cEm"></div><div class="big" id="cName"></div><div class="big" style="color:var(--accent)" id="cPrice"></div>
  <div class="paybtns"><button class="btn" id="payUpi">Pay with UPI QR</button><button class="btn alt" id="payCard">Tap debit / credit card</button></div>
  <p class="err" id="cErr"></p><button class="btn ghost" data-home>← Back</button></div></section>

<section class="screen" id="pay"><div class="center">
  <div class="big" id="pTitle"></div><div id="pBody"></div><p class="sub" id="pHint"></p>
  <div>Time left <span class="count" id="pCount"></span></div><button class="btn ghost" id="pCancel">Cancel</button></div></section>

<section class="screen" id="vend"><div class="center"><div class="spin"></div><div class="big">Payment received</div><p class="sub">Dispensing your item — please collect it from the tray below.</p></div></section>
<section class="screen" id="done"><div class="center"><div class="huge" id="dIcon"></div><div class="big" id="dTitle"></div><p class="sub" id="dMsg"></p><button class="btn" data-home>Done</button></div></section>

<section class="screen" id="pin"><div class="center"><div class="big">Service PIN</div><div class="dots" id="dots"></div><p class="err" id="pinErr"></p><div class="pinpad" id="pinpad"></div><button class="btn ghost" data-home>Cancel</button></div></section>
<section class="screen" id="service">
  <header><div class="logo">Restock mode</div><div class="where" id="svcWho"></div></header>
  <div class="svc" id="svcList"></div>
  <div class="svcbar"><button class="btn alt" id="svcUnlock">Unlock door</button><button class="btn alt" id="svcFill">Fill all to full</button><button class="btn" id="svcSave">Save & exit</button></div>
</section>
<script src="kiosk.js"></script>
</body>
</html>
